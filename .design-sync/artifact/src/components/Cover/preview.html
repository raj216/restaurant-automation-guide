<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kadmivo Brand Kit</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .blk { rx: var(--radius-square); }
  .deep { fill: var(--dark); }
  .brand { fill: var(--terracotta); }
  .tint { fill: var(--paper-deep); }
  .card { fill: var(--white); }
  .lift { fill: var(--line); }
  .badge { fill: var(--yellow); }
  .rule { stroke: var(--line); stroke-width: 1; }
  .words { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-size: 88px; line-height: .95; font-weight: 500; letter-spacing: -.045em; color: var(--ink); }
  .tag { margin: 14px 0 0 2px; font-family: var(--font-sans); font-size: 13px; line-height: 20px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 288" width="480" height="288">
<!--
  blocks      dark 228x228 bled off the top right (the dark bands) · terracotta 152x152 (the one accent) · white 228x152 ticket with a dark 19px top strip · paper-deep 152x76 at the foot · yellow 76x19 badge (it only means "pending"): about a third of 960x288
  arrangement the hero's order ticket as a slab with satellites: the white ticket laid across the terracotta and the dark slab, lifted by shadow-ticket's hard 14px/15px offset in line
  pattern     a few hairline rules in line across the ticket, from "Structure lists with hairline rules in line, not boxes"
  scales      sides in multiples of header-height (76px); rule pitch a quarter of it (19px); offset from shadow-ticket; corners radius-square
-->
<rect class="deep blk" x="756" y="-38" width="228" height="228"/>
<rect class="brand blk" x="528" y="38" width="152" height="152"/>
<rect class="tint blk" x="604" y="222" width="152" height="76"/>
<rect class="lift blk" x="636" y="110" width="228" height="152"/>
<rect class="card blk" x="622" y="95" width="228" height="152"/>
<rect class="deep blk" x="622" y="95" width="228" height="19"/>
<rect class="badge blk" x="758" y="128" width="76" height="19"/>
<line class="rule" x1="638" y1="166.5" x2="834" y2="166.5"/>
<line class="rule" x1="638" y1="185.5" x2="834" y2="185.5"/>
<line class="rule" x1="638" y1="204.5" x2="834" y2="204.5"/>
<line class="rule" x1="638" y1="223.5" x2="834" y2="223.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Kadmivo<br>Brand Kit</h1>
<p class="tag">Human-controlled phone-order recovery for independent restaurants.</p>
</div>
</div>
</body>
</html>
